# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

# shellcheck shell=sh
# shellcheck disable=SC2034  # ci/reload.sh reads these after sourcing this file
#
# The probe sends a PROPFIND on every reload: a reload that detached the
# dav_ext content handler would keep answering on the port but stop turning
# the request into a 207 multistatus.  The lock zone is declared too, so the
# shared-memory zone is set up and then torn down and rebuilt across every
# reload, which is the per-cycle state most likely to leak here.

mkdir -p "$WORK/root"
[ -f "$WORK/root/probe.txt" ] || printf 'reloaded' > "$WORK/root/probe.txt"

RELOAD_HTTP="
    dav_ext_lock_zone zone=rz:10m timeout=10s;"

RELOAD_SERVER="
        location / {
            root $WORK/root;
            dav_methods PUT DELETE MKCOL COPY MOVE;
            dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
            dav_ext_lock zone=rz;
        }"

RELOAD_EXPECT='207'

reload_probe() {
	curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
		-X PROPFIND -H 'Depth: 0' "http://127.0.0.1:$PORT/"
}
