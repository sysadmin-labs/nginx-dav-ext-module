name: FreeBSD

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday morning, so a new nginx release that breaks the module shows
    # up here and not in somebody's build
    - cron: '7 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freebsd:
    name: build and test in a virtual machine
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # every other workflow measures Linux, and the port this module is
    # packaged in is a FreeBSD one

    steps:
      - uses: actions/checkout@v7

      - name: Build and run the suite in a FreeBSD virtual machine
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: '14'
          prepare: |
            # curl is not in base; the suite needs HTTP::DAV, and the module
            # links libxml2 and libxslt
            pkg install -y git pcre2 curl libxml2 libxslt p5-HTTP-DAV
          run: |
            . .github/versions.env
            ci/build.sh "$NGINX_VERSION" "$HOME/nginx"
            # the VM runs as root, so nginx would drop its workers to the
            # built-in "nobody", which cannot read the root-owned test tree;
            # pin the workers to root through the main-context user directive
            TEST_NGINX_GLOBALS="user root wheel;" \
              TEST_NGINX_NO_SHUFFLE=1 \
              TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" prove -r t/
            # the WebDAV methods end to end, through the base system's libxml2
            ci/dav_ext.sh "$HOME/nginx/sbin/nginx"
            # www/nginx ships this module as a loadable object, so that is
            # the build the package is made of and it is built here too
            ci/build.sh "$NGINX_VERSION" "$HOME/nginx-dyn" dynamic
            so=$HOME/nginx-dyn/modules/ngx_http_dav_ext_module.so
            DAV_EXT_LOAD_MODULE=$so ci/dav_ext.sh "$HOME/nginx-dyn/sbin/nginx"
            TEST_NGINX_GLOBALS="user root wheel; load_module $so;" \
              TEST_NGINX_NO_SHUFFLE=1 \
              TEST_NGINX_BINARY="$HOME/nginx-dyn/sbin/nginx" prove -r t/
